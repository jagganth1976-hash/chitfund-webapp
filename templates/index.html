<!DOCTYPE html>
<html>

<head>

    <title>Chit Fund App</title>

    <style>

        body{
            font-family:Arial;
            background:#dff6ff;
            text-align:center;
            padding:20px;
        }

        .box{
            background:white;
            width:320px;
            margin:auto;
            padding:20px;
            border-radius:15px;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            border:none;
            color:white;
            font-weight:bold;
            cursor:pointer;
            border-radius:8px;
        }

        .green{
            background:green;
        }

        .blue{
            background:blue;
        }

        .orange{
            background:orange;
        }

    </style>

</head>

<body>

    <h1>CHIT FUND MANAGEMENT</h1>

    <div class="box">

        <h2>Add Member</h2>

        <form action="/add" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Member Name"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   required>

            <button class="green" type="submit">
                ADD MEMBER
            </button>

        </form>

        <hr>

        <h2>Search Member</h2>

        <form action="/search" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Member Name"
                   required>

            <button class="blue" type="submit">
                SEARCH
            </button>

        </form>

        <hr>

        <h2>Collect Payment</h2>

        <form action="/collect" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Member Name"
                   required>

            <button class="orange" type="submit">
                COLLECT ₹2000
            </button>

        </form>

    </div>

</body>
</html>
