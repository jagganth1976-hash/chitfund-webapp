<!DOCTYPE html>

<html>

<head>

    <title>Chit Fund Management</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body{

            margin:0;
            padding:0;
            font-family:Arial;
            background:#dff6ff;
            text-align:center;
        }

        h1{

            color:darkblue;
            padding-top:20px;
            font-size:38px;
        }

        .container{

            max-width:420px;
            margin:auto;
            padding:20px;
        }

        .menu-button{

            width:100%;
            padding:16px;
            margin-top:15px;
            border:none;
            border-radius:12px;
            font-size:18px;
            font-weight:bold;
            color:white;
            cursor:pointer;
        }

        .green{

            background:green;
        }

        .blue{

            background:blue;
        }

        .orange{

            background:orange;
        }

        .black{

            background:black;
        }

        .purple{

            background:purple;
        }

        .form-box{

            display:none;
            background:white;
            padding:20px;
            border-radius:15px;
            margin-top:20px;
            box-shadow:0px 0px 10px gray;
        }

        input{

            width:95%;
            padding:12px;
            margin-top:10px;
            font-size:16px;
            border-radius:8px;
            border:1px solid gray;
        }

        .submit-btn{

            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        a{

            text-decoration:none;
        }

    </style>

</head>

<body>

    <h1>CHIT FUND MANAGEMENT</h1>

    <div class="container">

        <!-- MENU BUTTONS -->

        <button class="menu-button green"
                onclick="showForm('addForm')">

            ADD MEMBER

        </button>

        <button class="menu-button blue"
                onclick="showForm('searchForm')">

            SEARCH MEMBER

        </button>

        <button class="menu-button orange"
                onclick="showForm('collectForm')">

            COLLECT MONEY

        </button>

        <a href="/members">

            <button class="menu-button black">

                VIEW ALL MEMBERS

            </button>

        </a>

        <button class="menu-button purple"
                onclick="showForm('uploadForm')">

            UPLOAD EXCEL

        </button>

        <!-- ADD MEMBER FORM -->

        <div id="addForm" class="form-box">

            <h2>Add Member</h2>

            <form action="/add" method="POST">

                <input type="text"
                       name="name"
                       placeholder="Member Name"
                       required>

                <input type="text"
                       name="phone"
                       placeholder="Phone Number"
                       required>

                <input type="number"
                       name="chit_amount"
                       placeholder="Chit Amount"
                       required>

                <input type="number"
                       name="chits"
                       placeholder="Number Of Chits"
                       required>

                <button class="submit-btn green"
                        type="submit">

                    ADD MEMBER

                </button>

            </form>

        </div>

        <!-- SEARCH MEMBER FORM -->

        <div id="searchForm" class="form-box">

            <h2>Search Member</h2>

            <form action="/search" method="POST">

                <input type="text"
                       name="phone"
                       placeholder="Enter Phone Number"
                       required>

                <button class="submit-btn blue"
                        type="submit">

                    SEARCH MEMBER

                </button>

            </form>

        </div>

        <!-- COLLECT PAYMENT FORM -->

        <div id="collectForm" class="form-box">

            <h2>Collect Payment</h2>

            <form action="/collect" method="POST">

                <input type="text"
                       name="phone"
                       placeholder="Phone Number"
                       required>

                <input type="number"
                       name="amount"
                       placeholder="Amount Collected"
                       required>

                <button class="submit-btn orange"
                        type="submit">

                    COLLECT MONEY

                </button>

            </form>

        </div>

        <!-- UPLOAD EXCEL FORM -->

        <div id="uploadForm" class="form-box">

            <h2>Upload Excel File</h2>

            <form action="/upload"
                  method="POST"
                  enctype="multipart/form-data">

                <input type="file"
                       name="file"
                       required>

                <button class="submit-btn purple"
                        type="submit">

                    UPLOAD EXCEL

                </button>

            </form>

        </div>

    </div>

    <script>

        function showForm(formId){

            let forms = document.getElementsByClassName("form-box");

            for(let i=0; i<forms.length; i++){

                forms[i].style.display = "none";
            }

            document.getElementById(formId).style.display = "block";
        }

    </script>

</body>

</html>
