<!-- ADD FORM -->

<div id="addForm" class="form-box">

    <h2>Add Member</h2>

    <form action="/add" method="POST">

        <input type="text"
               name="name"
               placeholder="Member Name"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="number"
               name="chit_amount"
               placeholder="Chit Amount"
               required>

        <input type="number"
               name="chits"
               placeholder="Number Of Chits"
               required>

        <button class="submit-btn green"
                type="submit">

            ADD MEMBER

        </button>

    </form>

</div>

<!-- SEARCH FORM -->

<div id="searchForm" class="form-box">

    <h2>Search Member</h2>

    <form action="/search" method="POST">

        <input type="text"
               name="phone"
               placeholder="Enter Phone Number"
               required>

        <button class="submit-btn blue"
                type="submit">

            SEARCH MEMBER

        </button>

    </form>

</div>

<!-- COLLECT FORM -->

<div id="collectForm" class="form-box">

    <h2>Collect Payment</h2>

    <form action="/collect" method="POST">

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="number"
               name="amount"
               placeholder="Amount Collected"
               required>

        <button class="submit-btn orange"
                type="submit">

            COLLECT MONEY

        </button>

    </form>

</div>
