<!DOCTYPE html>
<html>

<head>

    <title>Chit Fund App</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body{
            font-family:Arial;
            background:#dff6ff;
            margin:0;
            padding:15px;
            text-align:center;
        }

        h1{
            font-size:28px;
        }

        .box{
            background:white;
            width:95%;
            max-width:400px;
            margin:auto;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:95%;
            padding:12px;
            margin-top:10px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            color:white;
            font-size:16px;
            font-weight:bold;
            border-radius:8px;
        }

        .green{
            background:green;
        }

        .blue{
            background:blue;
        }

        .orange{
            background:orange;
        }

        hr{
            margin-top:25px;
            margin-bottom:25px;
        }

    </style>

</head>

<body>

    <h1>CHIT FUND MANAGEMENT</h1>

    <div class="box">

        <h2>Add Member</h2>

        <form action="/add" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Member Name"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   required>

            <input type="number"
                   name="chits"
                   placeholder="Number Of Chits"
                   required>

            <button class="green" type="submit">
                ADD MEMBER
            </button>

        </form>

        <hr>

        <h2>Search Member</h2>

        <form action="/search" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Member Name"
                   required>

            <button class="blue" type="submit">
                SEARCH
            </button>

        </form>

        <hr>

        <h2>Collect Payment</h2>

        <form action="/collect" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Member Name"
                   required>

            <input type="number"
                   name="paid_chits"
                   placeholder="How Many Chits Paid?"
                   required>

            <button class="orange" type="submit">
                COLLECT MONEY
            </button>

        </form>

    </div>

</body>
</html>
